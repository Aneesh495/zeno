name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y haxe
          mkdir -p _site/bin
          haxe -cp src -main zeno.cli.CLI -dce full -D analyzer-optimize -js _site/bin/zeno.js
          cp -a web/. _site/
          sed -i 's|../bin/zeno.js|bin/zeno.js|' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
